<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarona — le site de Fakefile</title>
  <meta name="description" content="Jarona, le site de Fakefile. Il le construit lui-même, morceau par morceau.">
  <link rel="canonical" href="https://jarona.ca/">
  <link rel="alternate" hreflang="fr-CA" href="https://jarona.ca/">
  <link rel="alternate" hreflang="en-CA" href="https://jarona.ca/en">
  <link rel="alternate" hreflang="x-default" href="https://jarona.ca/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jarona.ca/">
  <meta property="og:title" content="Jarona — le site de Fakefile">
  <meta property="og:description" content="Il le construit lui-même, morceau par morceau.">
  <meta property="og:locale" content="fr_CA">
  <meta property="og:locale:alternate" content="en_CA">
  <meta name="theme-color" content="#07050f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Les étoiles qui scintillent en arrière-plan -->
  <div class="ciel" aria-hidden="true">
    <span class="etoile e1">✦</span>
    <span class="etoile e2">✦</span>
    <span class="etoile e3">✧</span>
    <span class="etoile e4">✦</span>
    <span class="etoile e5">✧</span>
    <span class="etoile e6">✦</span>
  </div>

  <!-- Le bouton pour changer de langue -->
  <header class="haut">
    <a class="langue" href="/en" hreflang="en" lang="en">English</a>
  </header>

  <main class="accueil">
    <h1 class="titre" aria-label="Jarona">
      <span class="lettre l1" aria-hidden="true">J</span><span class="lettre l2" aria-hidden="true">A</span><span class="lettre l3" aria-hidden="true">R</span><span class="lettre l4" aria-hidden="true">O</span><span class="lettre l5" aria-hidden="true">N</span><span class="lettre l6" aria-hidden="true">A</span>
    </h1>

    <!-- La boîte de dialogue, comme dans un jeu -->
    <div class="dialogue">
      <p>* Bienvenue sur Jarona, le site de Fakefile.</p>
      <p>* Je le construis moi-même, morceau par morceau.</p>
      <p>* Reviens bientôt&nbsp;: il va y avoir plein de surprises&nbsp;!<span class="curseur" aria-hidden="true"></span></p>
    </div>

    <!-- Le bouton vers la chaîne YouTube de Fakefile -->
    <a class="youtube" href="https://www.youtube.com/@fakefileYT" target="_blank" rel="noopener">
      <span aria-hidden="true">▶</span> Ma chaîne YouTube
    </a>

    <!-- Le menu des prochaines pages. Fakefile peut les changer quand il veut. -->
    <ul class="menu" aria-label="Bientôt sur le site">
      <li><span class="coeur c1" aria-hidden="true">❤</span>Mes jeux</li>
      <li><span class="coeur c2" aria-hidden="true">❤</span>Mes dessins</li>
      <li><span class="coeur c3" aria-hidden="true">❤</span>Mes idées</li>
    </ul>
  </main>

  <footer class="pied">
    Fait par Fakefile · 2026
  </footer>
</body>
</html>
