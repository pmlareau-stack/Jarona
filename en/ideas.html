<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My ideas — Jarona</title>
  <meta name="description" content="Fakefile's blog: his ideas, on Jarona.">
  <link rel="canonical" href="https://jarona.ca/en/ideas">
  <link rel="alternate" hreflang="fr-CA" href="https://jarona.ca/idees">
  <link rel="alternate" hreflang="en-CA" href="https://jarona.ca/en/ideas">
  <link rel="alternate" hreflang="x-default" href="https://jarona.ca/idees">
  <meta name="theme-color" content="#07050f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="haut haut-page">
    <a class="langue" href="/en">← Home</a>
    <a class="langue" href="/idees" hreflang="fr" lang="fr">Français</a>
  </header>

  <main class="page">
    <h1 class="titre-page">❤ My ideas</h1>
    <p class="intro">* Fakefile's blog. His ideas, his stories, what he thinks.</p>

    <!-- Writing: only for Fakefile, with the secret code -->
    <div class="actions">
      <button class="bouton" id="ecrire" type="button">✏️ Write an idea</button>
      <button class="bouton-petit" id="verrouiller" type="button" hidden>🔒 Lock</button>
    </div>

    <p class="etat" id="etat" aria-live="polite"></p>
    <div class="liste-idees" id="liste-idees"></div>
  </main>

  <dialog class="dialogue-boite" id="dialogue-idee">
    <form id="form-idee">
      <h2>✏️ New idea</h2>
      <label>Title
        <input name="titre" maxlength="100" autocomplete="off">
      </label>
      <label>Your text
        <textarea name="texte" maxlength="5000" rows="8"></textarea>
      </label>
      <p class="rappel">* Reminder: no last name, no address and no school.</p>
      <p class="erreur" id="erreur-idee" aria-live="polite"></p>
      <div class="boutons">
        <button class="bouton-petit" id="annuler-idee" type="button">Cancel</button>
        <button class="bouton" id="sauver-idee" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <footer class="pied">
    Made by Fakefile · 2026
  </footer>

  <script src="/coffre.js"></script>
  <script src="/idees.js"></script>
</body>
</html>
