<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarona — Fakefile's website</title>
  <meta name="description" content="Jarona, Fakefile's website. He's building it himself, piece by piece.">
  <link rel="canonical" href="https://jarona.ca/en">
  <link rel="alternate" hreflang="fr-CA" href="https://jarona.ca/">
  <link rel="alternate" hreflang="en-CA" href="https://jarona.ca/en">
  <link rel="alternate" hreflang="x-default" href="https://jarona.ca/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jarona.ca/en">
  <meta property="og:title" content="Jarona — Fakefile's website">
  <meta property="og:description" content="He's building it himself, piece by piece.">
  <meta property="og:locale" content="en_CA">
  <meta property="og:locale:alternate" content="fr_CA">
  <meta name="theme-color" content="#07050f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Twinkling stars in the background -->
  <div class="ciel" aria-hidden="true">
    <span class="etoile e1">✦</span>
    <span class="etoile e2">✦</span>
    <span class="etoile e3">✧</span>
    <span class="etoile e4">✦</span>
    <span class="etoile e5">✧</span>
    <span class="etoile e6">✦</span>
  </div>

  <!-- Language button -->
  <header class="haut">
    <a class="langue" href="/" hreflang="fr" lang="fr">Français</a>
  </header>

  <main class="accueil">
    <h1 class="titre" aria-label="Jarona">
      <span class="lettre l1" aria-hidden="true">J</span><span class="lettre l2" aria-hidden="true">A</span><span class="lettre l3" aria-hidden="true">R</span><span class="lettre l4" aria-hidden="true">O</span><span class="lettre l5" aria-hidden="true">N</span><span class="lettre l6" aria-hidden="true">A</span>
    </h1>

    <!-- The dialogue box, like in a game -->
    <div class="dialogue">
      <p>* Welcome to Jarona, Fakefile's website.</p>
      <p>* I'm building it myself, piece by piece.</p>
      <p>* Come back soon: lots of surprises are on the way!<span class="curseur" aria-hidden="true"></span></p>
    </div>

    <!-- Button to Fakefile's YouTube channel -->
    <a class="youtube" href="https://www.youtube.com/@fakefileYT" target="_blank" rel="noopener">
      <span aria-hidden="true">▶</span> My YouTube channel
    </a>

    <!-- Menu of the next pages. Fakefile can change them whenever he wants. -->
    <ul class="menu" aria-label="Coming soon">
      <li><span class="coeur c1" aria-hidden="true">❤</span>My games</li>
      <li><span class="coeur c2" aria-hidden="true">❤</span>My drawings</li>
      <li><span class="coeur c3" aria-hidden="true">❤</span>My ideas</li>
    </ul>
  </main>

  <footer class="pied">
    Made by Fakefile · 2026
  </footer>
</body>
</html>
