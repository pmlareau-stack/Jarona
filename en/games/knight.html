<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kris vs the Knight — Jarona</title>
  <meta name="description" content="A game by Fakefile: Kris closes the dark fountains of the maze and runs from the Knight.">
  <link rel="canonical" href="https://jarona.ca/en/games/knight">
  <link rel="alternate" hreflang="fr-CA" href="https://jarona.ca/jeux/chevalier">
  <link rel="alternate" hreflang="en-CA" href="https://jarona.ca/en/games/knight">
  <link rel="alternate" hreflang="x-default" href="https://jarona.ca/jeux/chevalier">
  <meta name="theme-color" content="#07050f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="haut haut-page">
    <a class="langue" href="/en/games">← My games</a>
    <a class="langue" href="/jeux/chevalier" hreflang="fr" lang="fr">Français</a>
  </header>

  <main class="page page-jeu">
    <h1 class="titre-jeu">Kris vs the Knight</h1>

    <p class="hud">
      <span id="vies"></span>
      <span id="score"></span>
      <span id="record"></span>
      <span id="niveau"></span>
    </p>

    <canvas class="arene-labyrinthe" id="labyrinthe" width="448" height="496" aria-label="The game: Kris closes the dark fountains and runs from the Knight"></canvas>

    <!-- Arrow buttons, to play with a finger on a phone or tablet -->
    <div class="manette">
      <button class="fleche fleche-haut" type="button" data-dir="haut" aria-label="Up">▲</button>
      <button class="fleche fleche-gauche" type="button" data-dir="gauche" aria-label="Left">◀</button>
      <button class="fleche fleche-droite" type="button" data-dir="droite" aria-label="Right">▶</button>
      <button class="fleche fleche-bas" type="button" data-dir="bas" aria-label="Down">▼</button>
    </div>

    <p class="aide-jeu">* Arrow keys, or slide your finger on the game.</p>
  </main>

  <footer class="pied">
    Made by Fakefile · 2026
  </footer>

  <script src="/jeux/chevalier.js"></script>
</body>
</html>
